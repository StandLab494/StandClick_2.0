<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>StandClick 2.0 — Standoff 2 Skins</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        button { cursor: pointer; outline: none; }
        
        body { 
            background: linear-gradient(135deg, #0a0f1a 0%, #0a1a2e 100%); 
            font-family: 'Segoe UI', 'Poppins', sans-serif; 
            color: white; 
            min-height: 100vh;
        }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,77,77,0.3);
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .gold-display {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 20px;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(255,215,0,0.3);
        }
        
        .nick-display {
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .rank-display {
            background: linear-gradient(135deg, #ff4d4d, #cc0000);
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
        }
        
        .online-counter {
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 30px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .character-card {
            flex: 1;
            min-width: 300px;
            background: rgba(0,0,0,0.4);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255,77,77,0.3);
        }
        
        .character-canvas {
            width: 100%;
            height: 400px;
            background: radial-gradient(circle at center, #1a1a2e, #0a0a1a);
            border-radius: 20px;
            margin-bottom: 15px;
        }
        
        .click-area {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }
        
        .click-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #8b0000);
            border: 3px solid #ffd700;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 0 30px rgba(255,77,77,0.5);
        }
        
        .click-btn:active { transform: scale(0.95); }
        
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .case-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            border: 1px solid rgba(255,77,77,0.2);
        }
        
        .case-card:hover { transform: translateY(-5px); border-color: #ff4d4d; }
        .case-icon { font-size: 56px; margin-bottom: 15px; }
        .case-name { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .case-price { color: #ffd700; font-size: 18px; font-weight: bold; margin: 10px 0; }
        
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .skin-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255,77,77,0.2);
        }
        
        .skin-card:hover { transform: translateY(-3px); border-color: #ff4d4d; background: #2d3a4e; }
        .skin-icon { font-size: 40px; margin-bottom: 8px; }
        .skin-name { font-size: 11px; font-weight: bold; margin-bottom: 4px; }
        .skin-rarity { font-size: 9px; padding: 2px 8px; border-radius: 20px; display: inline-block; }
        
        .chances-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .chances-table th, .chances-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .chances-table th { background: #ff4d4d; color: white; }
        
        .rarity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .rarity-common { background: #3b82f6; }
        .rarity-rare { background: #a855f7; }
        .rarity-epic { background: #ec4899; }
        .rarity-legendary { background: #f97316; }
        .rarity-arcane { background: #ef4444; }
        .rarity-mythic { background: #06b6d4; }
        
        .btn {
            background: linear-gradient(135deg, #ff4d4d, #cc0000);
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        
        .btn:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(255,77,77,0.5); }
        
        .preview-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .preview-canvas {
            width: 90%;
            max-width: 600px;
            height: 400px;
            background: #0a0a1a;
            border-radius: 20px;
            border: 2px solid #ff4d4d;
        }
        
        .promo-banner {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border-radius: 16px;
            padding: 15px 20px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            animation: promoGlow 2s infinite;
            cursor: pointer;
        }
        
        @keyframes promoGlow {
            0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
            50% { box-shadow: 0 0 0 10px rgba(245,158,11,0); }
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .nav-btn {
            background: rgba(30,41,59,0.8);
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            color: #aaa;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 14px;
        }
        
        .nav-btn.active {
            background: #ff4d4d;
            color: white;
            box-shadow: 0 0 15px rgba(255,77,77,0.5);
        }
        
        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            border: 1px solid rgba(255,77,77,0.3);
            cursor: pointer;
            transition: 0.2s;
        }
        
        .music-player:hover { transform: scale(1.05); border-color: #ff4d4d; }
        .music-icon { font-size: 24px; }
        .music-name { font-size: 12px; color: #ffd700; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        @media (max-width: 600px) {
            .click-btn { width: 120px; height: 120px; font-size: 16px; }
            .top-bar { flex-direction: column; text-align: center; }
            .character-canvas { height: 300px; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    
    <div class="top-bar">
        <div class="user-info">
            <div class="nick-display" id="nick">Игрок</div>
            <div class="rank-display" id="rank">🏅 Новичок</div>
            <div class="gold-display" id="gold">💰 0 G</div>
            <div class="online-counter" id="onlineCounter">🟢 Подключение...</div>

        <div class="user-info">

        </div>
    </div>
    
    <div class="nav">

    <div id="page-main" class="page active">
        <div class="main-layout">

                <canvas id="heroCanvas" class="character-canvas"></canvas>

                    <div id="autoBonus" style="font-size:14px; color:#ffaa00; margin-bottom:10px;">🤖 Авто-доход: 0 G/сек</div>

            </div>
            <div class="character-card" style="display: flex; flex-direction: column; justify-content: center;">
                <div id="promoContainer"></div>
                <div class="click-area" style="margin: 10px 0;">
                    <button class="click-btn" id="clickBtn">🔫<br>КЛИК</button>
                    <div style="text-align:center;">
                        <button class="btn" id="megaClickBtn" style="width:120px; height:80px; font-size:16px;">⚡MEGA<br>+1000G</button>
                        <div class="mega-timer" id="megaTimer" style="font-size:12px; margin-top:5px;">00:00:00</div>
                    </div>
                </div>
                <button class="btn" onclick="document.getElementById('clothesModal').style.display='flex'" style="margin-top:10px;">👕 Одежда</button>
            </div>
        </div>
    </div>

    <div id="page-inventory" class="page">
        <div style="background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px;">
            <h3>🎒 ИНВЕНТАРЬ</h3>
            <div id="skinsList" class="inventory-grid"></div>
            <hr style="margin: 20px 0;">
            <h4>⚔️ ЭКИПИРОВКА</h4>
            <div id="weaponsList"></div>
        </div>
    </div>

    <div id="page-cases" class="page">
        <div class="cases-grid" id="casesGrid"></div>
        <div style="background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px; margin-top: 20px;">
            <h3>📊 ШАНСЫ ВЫПАДЕНИЯ</h3>
            <table class="chances-table" id="chancesTable"></table>
        </div>
    </div>

    <div id="page-stats" class="page">
        <div style="background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px;">
            <h3>📊 СТАТИСТИКА ИГРОКА</h3>
            <div id="statsContent"></div>
        </div>
    </div>
</div>

<div class="music-player" id="musicPlayer">
    <div class="music-icon" id="musicIcon">🎵</div>
    <div class="music-name" id="musicName">Phonk</div>
</div>

<div id="previewModal" class="preview-modal">
    <h2 id="previewTitle" style="color:#ffd700; margin-bottom:15px;">Осмотр</h2>
    <canvas id="previewCanvas" class="preview-canvas"></canvas>
    <button class="btn" style="margin-top: 20px;" onclick="closePreview()">ЗАКРЫТЬ</button>
</div>

<div id="clothesModal" style="display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95); z-index:1005; align-items:center; justify-content:center;">
    <div style="background:linear-gradient(135deg, #1a1a2e, #0f0f1a); border-radius: 24px; padding: 25px; max-width: 350px; text-align: center; border: 1px solid #ff4d4d;">
        <h3 style="color:#ff4d4d; margin-bottom: 15px;">👕 ОДЕЖДА</h3>
        <button class="btn" style="width:100%; margin-bottom:10px;" onclick="equipClothing(1)">Черная рубашка</button>
        <button class="btn" style="width:100%; margin-bottom:10px; background:#e2e8f0; color:#000;" onclick="equipClothing(2)">Белая футболка</button>
        <button class="btn" style="width:100%; background:linear-gradient(135deg,#a855f7,#7c3aed);" onclick="document.getElementById('costumeUpload').click()">📁 Загрузить свой костюм</button>
        <input type="file" id="costumeUpload" accept="image/*" style="display:none">
        <button class="btn btn-danger" style="margin-top:15px;" onclick="document.getElementById('clothesModal').style.display='none'">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="rouletteModal" style="display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center; flex-direction:column;">
    <h2 style="color:#ff4d4d;">Открытие кейса</h2>
    <div style="width:90%; max-width:600px; height:120px; background:#1e293b; border:2px solid #ff4d4d; border-radius:10px; overflow:hidden;">
        <div id="rouletteContainer" style="display:flex; height:100%; width:max-content; transition:transform 5s cubic-bezier(0.1,0,0.1,1);"></div>
    </div>
    <div id="rouletteResult" style="display:none; margin-top:20px;">
        <h3 id="rouletteItemName"></h3>
        <button class="btn" onclick="closeRoulette()">ОК</button>
    </div>
</div>

<script>
const gun = Gun(['https://gun-vue.yogg.app/gun', 'https://dletta.pub/gun', 'https://peer.wallie.io/gun']);

let game = {

    skins: [], usedPromos: [], lastMegaClick: 0,
    equippedClothing: null,
    weapons: {

        awp: { name: "AWP", active: false, skin: null },

    }
};

const BUILTIN_PROMOS = {
    "FIX_GAME": { gold: "random(1000, 50000)", skin: null, desc: "🔧 FIX_GAME — 1000-50000 G!" },
    "Condensation": { gold: 0, skin: "M9 Forever", desc: "💎 Condensation — скин M9 Forever!" },
};

const PLAYLIST = [
    { name: "🔥 Phonk", url: "https://cdn.pixabay.com/download/audio/2022/03/10/audio_c2c5a6f3a5.mp3", icon: "🔥" },
    { name: "🌊 Спокойная", url: "https://cdn.pixabay.com/download/audio/2022/05/16/audio_2c8e2c6a1a.mp3", icon: "🌊" },
    { name: "😔 Грустная", url: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c5d4e3b2.mp3", icon: "😔" },

];

let currentTrack = 0;
let audio = new Audio();
let isPlaying = false;

function playTrack(index) {
    const track = PLAYLIST[index];
    if (!track) return;
    audio.pause();
    audio = new Audio(track.url);
    audio.loop = true;
    audio.volume = 0.3;
    audio.play().catch(e => console.log('Автозапуск заблокирован'));
    isPlaying = true;
    document.getElementById('musicName').innerHTML = track.name;
    document.getElementById('musicIcon').innerHTML = track.icon;
    currentTrack = index;
}

function nextTrack() {
    currentTrack = (currentTrack + 1) % PLAYLIST.length;
    playTrack(currentTrack);
}

document.getElementById('musicPlayer').onclick = nextTrack;

document.body.addEventListener('click', function firstClick() {
    if (!isPlaying) playTrack(0);
    document.body.removeEventListener('click', firstClick);
}, { once: true });

    if (itemName.includes("Bayonet")) return "bayonet";
    if (itemName.includes("Huntsman")) return "huntsman";
    if (itemName.includes("Falchion")) return "falchion";
    if (itemName.includes("Daggers")) return "daggers";
    if (itemName.includes("Ursus")) return "ursus";
    if (itemName.includes("Navaja")) return "navaja";
    if (itemName.includes("Stiletto")) return "stiletto";
    if (itemName.includes("Talon")) return "talon";
    if (itemName.includes("AK-47")) return "ak47";
    if (itemName.includes("AWP")) return "awp";
    if (itemName.includes("M4A4")) return "m4a4";
    if (itemName.includes("M4A1-S")) return "m4a1";
    if (itemName.includes("Desert Eagle")) return "deagle";
    if (itemName.includes("USP-S")) return "usp";
    if (itemName.includes("Glock-18")) return "glock";
