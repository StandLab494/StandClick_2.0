<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Сервера выключены</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Красное свечение по краям */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,0,0,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Анимация пульсации */
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #ff0000; }
            100% { text-shadow: 0 0 25px #ff0000, 0 0 35px #ff0000; }
        }

        .container {
            text-align: center;
            padding: 30px;
            z-index: 10;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Красный экран-заставка */
        .red-screen {
            position: absolute;
            inset: 0;
            background: #8B0000;
            opacity: 0;
            animation: redFlash 1s ease-out forwards;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes redFlash {
            0% { opacity: 0; }
            20% { opacity: 0.6; }
            100% { opacity: 0; }
        }

        .icon {
            font-size: 120px;
            margin-bottom: 20px;
            animation: pulse 2s infinite, glow 1.5s infinite alternate;
            filter: drop-shadow(0 0 20px rgba(255,0,0,0.5));
        }

        h1 {
            font-size: clamp(32px, 8vw, 52px);
            font-weight: 900;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
            animation: blink 1.5s infinite;
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .message {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 30px;
            max-width: 350px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Кнопка попробовать снова */
        .retry-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #8B0000, #4a0000);
            border: 2px solid #ff0000;
            border-radius: 50px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .retry-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #aa0000, #6a0000);
            box-shadow: 0 0 20px rgba(255,0,0,0.4);
        }

        .retry-btn:active {
            transform: scale(0.95);
        }

        /* Статус сервера */
        .server-status {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .red-dot {
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            animation: blink 1s infinite;
            box-shadow: 0 0 8px #ff0000;
        }

        .status-text {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Ошибка */
        .error-code {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="red-screen"></div>
    
    <div class="container">
        <div class="icon">
            💀⚠️💀
        </div>
        
        <h1>СЕРВЕРА ВЫКЛЮЧЕНЫ</h1>
        
        <div class="subtitle">
            ДОСТУП ЗАКРЫТ
        </div>
        
        <div class="message">
            Игровые сервера временно отключены.<br>
            Сервера закрыты на время.<br>
            Пожалуйста, зайдите позже.
        </div>

        <button class="retry-btn" onclick="location.reload()">
            🔄 ПРОВЕРИТЬ СНОВА
        </button>

        <div class="server-status">
            <div class="red-dot"></div>
            <div class="status-text">ВСЕ СЕРВЕРА OFFLINE</div>
        </div>

        <div class="error-code">
            ERROR CODE: SRV-503 | CONNECTION LOST
        </div>
    </div>

    <script>
        // Создаем летящие красные частицы
        function createParticles() {
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = `rgba(255, 0, 0, ${Math.random() * 0.4 + 0.1})`;
                particle.style.borderRadius = '50%';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '5';
                particle.style.animation = `float ${Math.random() * 4 + 3}s infinite ease-in-out`;
                particle.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(particle);
            }
        }

        // Добавляем стиль для частиц
        const style = document.createElement('style');
        style.textContent = `
            @keyframes float {
                0% {
                    transform: translateY(0) translateX(0);
                    opacity: 0;
                }
                20% {
                    opacity: 0.8;
                }
                80% {
                    opacity: 0.8;
                }
                100% {
                    transform: translateY(-200px) translateX(${Math.random() * 100 - 50}px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        createParticles();

        // Обновляем статус с таймером (типо проверка)
        let attempts = 0;
        setInterval(() => {
            attempts++;
            const statusText = document.querySelector('.status-text');
            if (statusText && attempts % 6 === 0) {
                statusText.style.opacity = '0.5';
                setTimeout(() => {
                    if (statusText) statusText.style.opacity = '1';
                }, 500);
            }
        }, 10000);
    </script>
</body>
</html>
