<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Standoff 2 — Крафт скинов + Промокоды</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0a0a0c 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        .gold {
            font-size: 42px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 15px rgba(255,204,0,0.5);
        }

        .nick {
            font-size: 18px;
            color: #aaa;
            margin: 5px 0;
        }

        .online-counter {
            background: rgba(0,0,0,0.5);
            border-radius: 30px;
            padding: 5px 15px;
            display: inline-block;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .click-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffcc00, #ff8800);
            border: none;
            color: #000;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255,204,0,0.4);
            margin: 20px auto;
            transition: transform 0.05s;
        }

        .click-btn:active {
            transform: scale(0.96);
        }

        .btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid rgba(255,204,0,0.2);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .item-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border-left: 3px solid #ffcc00;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: #1e293b;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn.active {
            background: #ffcc00;
            color: #000;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .promo-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .promo-input input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #ffcc00;
            padding: 10px;
            border-radius: 30px;
            color: white;
            text-align: center;
        }

        .weapon-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 12px;
            margin: 8px 0;
            border-left: 4px solid #ffcc00;
        }

        .id-box {
            background: rgba(0,0,0,0.4);
            border-radius: 14px;
            padding: 10px 14px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ffcc00;
            gap: 8px;
        }
        #playerIdDisplay {
            font-size: 13px;
            color: #ffcc00;
            font-weight: bold;
            flex: 1;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <button class="nav-btn active" data-page="main">🎯</button>
        <button class="nav-btn" data-page="weapons">🔫</button>
        <button class="nav-btn" data-page="inventory">📦</button>
        <button class="nav-btn" data-page="craft">🔨</button>
        <button class="nav-btn" data-page="shop">🎁</button>
        <button class="nav-btn" data-page="promo">🔑</button>
    </div>

    <div id="page-main" class="page active">
        <div class="online-counter" id="onlineCounter">🟢 12 игроков онлайн</div>
        <div class="gold" id="gold">0 G</div>
        <div class="nick" id="nick">Игрок</div>
        <div class="nick" id="rank">🏆 Silver I</div>
        <div id="skinBonusDisplay" style="font-size:12px;color:#ffaa00;">🎨 Бонус: +0% голда</div>
        
        <button class="click-btn" id="clickBtn">CLICK</button>
        
        <div class="card">
            <div class="id-box">
                <span>🆔 ID:</span>
                <span id="playerIdDisplay">—</span>
                <button class="btn" style="padding:5px 12px;margin:0;" onclick="copyPlayerId()">📋</button>
            </div>
            <div style="margin-top:10px;">
                <button class="btn" id="changeNickBtn">✏️ Сменить ник</button>
                <button class="btn btn-danger" id="resetBtn">🔄 Сбросить</button>
            </div>
        </div>
    </div>

    <div id="page-weapons" class="page">
        <div class="card"><h3>🔫 ВЫБЕРИ ОРУЖИЕ</h3><div id="weaponsList"></div></div>
    </div>

    <div id="page-inventory" class="page">
        <div class="card"><h3>🎨 МОИ СКИНЫ</h3><div id="skinsList" class="items-grid"></div></div>
    </div>

    <div id="page-craft" class="page">
        <div class="card">
            <h3>🔨 КРАФТ СКИНОВ</h3>
            <p style="font-size:12px;">Выбери 3 одинаковых скина для крафта</p>
            <div id="craftAvailable" class="items-grid" style="max-height: 200px;"></div>
            <button class="btn" id="openCraftWindowBtn">🔧 КРАФТ</button>
        </div>
    </div>

    <div id="page-shop" class="page">
        <div class="card"><h3>📦 Обычный кейс</h3><p>500 G</p><button class="btn" id="openCommonCase">Открыть</button></div>
        <div class="card"><h3>🔥 Редкий кейс</h3><p>1500 G</p><button class="btn" id="openRareCase">Открыть</button></div>
        <div class="card"><h3>💎 Легендарный кейс</h3><p>5000 G</p><button class="btn" id="openLegendaryCase">Открыть</button></div>
    </div>

    <div id="page-promo" class="page">
        <div class="card">
            <h3>🔑 Активировать промокод</h3>
            <div class="promo-input">
                <input type="text" id="promoCodeInput" placeholder="Введите промокод">
                <button class="btn" id="activatePromoBtn">Активировать</button>
            </div>
        </div>
    </div>
</div>

<div id="craftModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); align-items:center; justify-content:center; z-index:1000;">
    <div style="background:#1a1a2e; border-radius:30px; padding:20px; max-width:400px; width:90%; border:2px solid #ffcc00;">
        <h3>🔨 КРАФТ СКИНОВ</h3>
        <div style="display:flex; justify-content:center; gap:10px; margin:20px 0;">
            <div id="craftSlot1" style="background:#1e293b; width:70px; height:90px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:2px solid #334155;">❓</div>
            <div id="craftSlot2" style="background:#1e293b; width:70px; height:90px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:2px solid #334155;">❓</div>
            <div id="craftSlot3" style="background:#1e293b; width:70px; height:90px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:2px solid #334155;">❓</div>
            <div style="font-size:24px;">→</div>
            <div id="craftResult" style="background:#1e293b; width:70px; height:90px; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; border:2px solid #ffcc00;">❓</div>
        </div>
        <button class="btn" id="doCraftBtn" style="width:100%;">СКРАФТИТЬ</button>
        <button class="btn btn-danger" id="closeCraftBtn" style="width:100%; margin-top:10px;">ЗАКРЫТЬ</button>
    </div>
</div>

<script>
    // ========== ВСТРОЕННЫЕ ПРОМОКОДЫ ==========
    const HARDCODED_PROMOS = {
        "EUSHYB4D6Z65": 4500,
        "KR8TWG": 10000,
        "БУРМАЛДЕНС": 7000,
        "TOP_GAME": 1028,
        "SECRET": 10000,
        "STANDCLICK": 5000,
        "STLAB": 1000
    };

    // ========== ОСНОВНЫЕ ДАННЫЕ ==========
    let game = {
        id: null,
        nick: "Игрок",
        gold: 1000,
        mmr: 0,
        wins: 0,
        skins: [],
        usedPromos: [],
        weapons: {
            awp:    { name: "AWP", active: true, skin: null },
            ak47:   { name: "AK-47", active: false, skin: null },
            m4a4:   { name: "M4A4", active: false, skin: null },
            deagle: { name: "Desert Eagle", active: false, skin: null }
        }
    };

    // Скины
    const commonSkins = [
        { name: "G22 Frost", rarity: "common", bonus: 2 },
        { name: "MP5 Swarm", rarity: "common", bonus: 2 },
        { name: "SSG 08 Abyss", rarity: "common", bonus: 2 }
    ];
    const rareSkins = [
        { name: "AKM Tiger", rarity: "rare", bonus: 5 },
        { name: "Desert Eagle Cobra", rarity: "rare", bonus: 5 },
        { name: "M4A4 Griffin", rarity: "rare", bonus: 5 }
    ];
    const epicSkins = [
        { name: "M4 Lizard", rarity: "epic", bonus: 10 },
        { name: "AWM Scratch", rarity: "epic", bonus: 10 },
        { name: "AK-47 Bloodsport", rarity: "epic", bonus: 10 }
    ];
    const legendarySkins = [
        { name: "AWP Dragon Lore", rarity: "legendary", bonus: 18 },
        { name: "Karambit Fade", rarity: "legendary", bonus: 18 },
        { name: "M9 Bayonet", rarity: "legendary", bonus: 18 }
    ];

    // ========== ФУНКЦИИ ==========
    function generateId() {
        return 'ST2-' + Math.random().toString(36).substring(2, 10).toUpperCase();
    }

    function getSkinRarity(skinName) {
        const allSkins = [...commonSkins, ...rareSkins, ...epicSkins, ...legendarySkins];
        const skin = allSkins.find(s => s.name === skinName);
        return skin ? skin.rarity : "common";
    }

    function getSkinBonus(skinName) {
        const allSkins = [...commonSkins, ...rareSkins, ...epicSkins, ...legendarySkins];
        const skin = allSkins.find(s => s.name === skinName);
        return skin ? skin.bonus : 2;
    }

    function getActiveWeapon() {
        for (let id in game.weapons) if (game.weapons[id].active) return game.weapons[id];
        return game.weapons.awp;
    }

    function getActiveWeaponBonus() {
        const weapon = getActiveWeapon();
        if (weapon.skin) return getSkinBonus(weapon.skin.name);
        return 0;
    }

    function getClickGain() {
        const base = 2;
        const bonus = getActiveWeaponBonus();
        return base + Math.floor(base * bonus / 100);
    }

    function getRankName() {
        if (game.mmr >= 5000) return "🏆 The Global Elite";
        if (game.mmr >= 3000) return "🏅 Master Guardian";
        if (game.mmr >= 1500) return "⭐ Gold Nova";
        if (game.mmr >= 500) return "🥉 Silver III";
        return "🥉 Silver I";
    }

    function saveGame() {
        if (!game.id) return;
        localStorage.setItem('standclick_game', JSON.stringify(game));
    }

    function loadGame() {
        const saved = localStorage.getItem('standclick_game');
        if (saved) {
            try {
                const d = JSON.parse(saved);
                game.id = d.id;
                game.nick = d.nick || "Игрок";
                game.gold = d.gold ?? 1000;
                game.mmr = d.mmr ?? 0;
                game.wins = d.wins ?? 0;
                game.skins = d.skins || [];
                game.usedPromos = d.usedPromos || [];
                if (d.weapons) game.weapons = d.weapons;
            } catch(e) {}
        }
        if (!game.id) {
            game.id = generateId();
            saveGame();
        }
        updateUI();
    }

    function updateUI() {
        document.getElementById('gold').innerHTML = Math.floor(game.gold) + " G";
        document.getElementById('nick').innerText = game.nick;
        document.getElementById('rank').innerHTML = getRankName();
        document.getElementById('playerIdDisplay').innerText = game.id;
        document.getElementById('skinBonusDisplay').innerHTML = `🎨 Бонус: +${getActiveWeaponBonus()}% голда`;
        
        // Скины
        document.getElementById('skinsList').innerHTML = game.skins.map((skin, i) => 
            `<div class="item-card" onclick="selectSkinForWeapon(${i})">
                <div>${skin.rarity === 'common' ? '🔵' : skin.rarity === 'rare' ? '🟢' : skin.rarity === 'epic' ? '🟣' : '🟠'}</div>
                <div>${skin.name}</div>
                <div style="font-size:10px;">${skin.rarity}</div>
            </div>`
        ).join('') || '<div style="color:#666;">Нет скинов</div>';
        
        // Оружие
        renderWeaponsList();
        updateCraftAvailable();
    }

    function renderWeaponsList() {
        const container = document.getElementById('weaponsList');
        container.innerHTML = Object.entries(game.weapons).map(([id, w]) => `
            <div class="weapon-card">
                <div>🔫 ${w.name} ${w.active ? '✅' : ''}</div>
                <div style="font-size:12px;">🎨 Скин: ${w.skin ? w.skin.name : 'нет'}</div>
                ${!w.active ? `<button class="btn" onclick="equipWeapon('${id}')">🔫 ПРИМЕНИТЬ</button>` : ''}
            </div>
        `).join('');
    }

    function equipWeapon(weaponId) {
        for (let id in game.weapons) game.weapons[id].active = (id === weaponId);
        saveGame();
        updateUI();
        showToast(`🔫 ${game.weapons[weaponId].name} активировано!`);
    }

    function selectSkinForWeapon(index) {
        const skin = game.skins[index];
        let html = '';
        for (let [id, w] of Object.entries(game.weapons)) {
            html += `<div class="weapon-card" onclick="attachSkinToWeapon('${id}', ${index})">
                <div>🔫 ${w.name}</div>
                <div style="font-size:12px;">🎨 Текущий: ${w.skin ? w.skin.name : 'нет'}</div>
                <button class="btn">🎨 НАДЕТЬ</button>
            </div>`;
        }
        document.getElementById('weaponsList').innerHTML = html;
        showToast(`🎨 Выбери оружие для "${skin.name}"`);
    }

    function attachSkinToWeapon(weaponId, skinIndex) {
        game.weapons[weaponId].skin = game.skins[skinIndex];
        saveGame();
        updateUI();
        showToast(`🎨 Скин надет на ${game.weapons[weaponId].name}!`);
        renderWeaponsList();
    }

    // Кейсы
    function openCase(price, skinList, caseName) {
        if (game.gold < price) { showToast(`❌ Нужно ${price} G`); return; }
        game.gold -= price;
        const randomSkin = skinList[Math.floor(Math.random() * skinList.length)];
        game.skins.push({ name: randomSkin.name, rarity: randomSkin.rarity });
        saveGame();
        updateUI();
        showToast(`🎁 ${caseName} | Выпало: ${randomSkin.name} (${randomSkin.rarity})!`);
    }

    // Крафт
    let craftSelectedSkin = null;
    function updateCraftAvailable() {
        const container = document.getElementById('craftAvailable');
        const skinCounts = {};
        for (let skin of game.skins) skinCounts[skin.name] = (skinCounts[skin.name] || 0) + 1;
        let html = '';
        for (let [name, count] of Object.entries(skinCounts)) {
            if (count >= 3) {
                html += `<div class="item-card" onclick="selectSkinForCraft('${name.replace(/'/g, "\\'")}')">
                    <div>${getSkinRarity(name) === 'common' ? '🔵' : getSkinRarity(name) === 'rare' ? '🟢' : getSkinRarity(name) === 'epic' ? '🟣' : '🟠'}</div>
                    <div>${name}</div>
                    <div style="font-size:10px;">${count} шт.</div>
                </div>`;
            }
        }
        container.innerHTML = html || '<div style="color:#666;">Нет скинов для крафта (нужно 3 одинаковых)</div>';
    }

    function selectSkinForCraft(skinName) {
        craftSelectedSkin = skinName;
        openCraftWindow();
    }

    function getNextSkin(currentSkin) {
        const rarity = getSkinRarity(currentSkin);
        if (rarity === "common") return rareSkins[Math.floor(Math.random() * rareSkins.length)].name;
        if (rarity === "rare") return epicSkins[Math.floor(Math.random() * epicSkins.length)].name;
        if (rarity === "epic") return legendarySkins[Math.floor(Math.random() * legendarySkins.length)].name;
        return null;
    }

    function openCraftWindow() {
        if (!craftSelectedSkin) { showToast("❌ Выберите скин!"); return; }
        const count = game.skins.filter(s => s.name === craftSelectedSkin).length;
        if (count < 3) { showToast("❌ Нужно 3 скина!"); return; }
        document.getElementById('craftSlot1').innerHTML = craftSelectedSkin;
        document.getElementById('craftSlot2').innerHTML = craftSelectedSkin;
        document.getElementById('craftSlot3').innerHTML = craftSelectedSkin;
        const newSkin = getNextSkin(craftSelectedSkin);
        document.getElementById('craftResult').innerHTML = newSkin || '❌';
        document.getElementById('craftModal').style.display = 'flex';
    }

    function doCraft() {
        if (!craftSelectedSkin) return;
        const count = game.skins.filter(s => s.name === craftSelectedSkin).length;
        if (count < 3) { showToast("❌ Недостаточно!"); closeCraftWindow(); return; }
        const newSkinName = getNextSkin(craftSelectedSkin);
        if (!newSkinName) { showToast("❌ Нельзя улучшить!"); closeCraftWindow(); return; }
        let removed = 0;
        for (let i = game.skins.length-1; i >=0 && removed<3; i--) {
            if (game.skins[i].name === craftSelectedSkin) { game.skins.splice(i,1); removed++; }
        }
        game.skins.push({ name: newSkinName, rarity: getSkinRarity(newSkinName) });
        saveGame();
        updateUI();
        showToast(`🔨 Крафт! +${newSkinName}`);
        closeCraftWindow();
        craftSelectedSkin = null;
    }

    function closeCraftWindow() {
        document.getElementById('craftModal').style.display = 'none';
        document.getElementById('craftSlot1').innerHTML = '❓';
        document.getElementById('craftSlot2').innerHTML = '❓';
        document.getElementById('craftSlot3').innerHTML = '❓';
        document.getElementById('craftResult').innerHTML = '❓';
    }

    // Промокоды
    function activatePromo() {
        const code = document.getElementById('promoCodeInput').value.trim().toUpperCase();
        if (!code) { showToast("❌ Введите промокод!"); return; }
        
        if (!game.usedPromos) game.usedPromos = [];
        
        if (game.usedPromos.includes(code)) {
            showToast("❌ Промокод уже использован!");
            return;
        }
        
        if (HARDCODED_PROMOS[code]) {
            const gold = HARDCODED_PROMOS[code];
            game.gold += gold;
            game.usedPromos.push(code);
            saveGame();
            updateUI();
            document.getElementById('promoCodeInput').value = '';
            showToast(`🎉 +${gold} G! Промокод активирован!`);
            return;
        }
        
        showToast("❌ Неверный промокод!");
    }

    // Вспомогательные функции
    function copyPlayerId() {
        if (!game.id) return;
        navigator.clipboard.writeText(game.id).then(() => showToast('📋 ID скопирован!'));
    }

    function showToast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = `position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#10b981;padding:10px 20px;border-radius:30px;font-size:13px;z-index:9999;animation:fadeOut 2s ease;white-space:nowrap;`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2000);
    }

    // Добавляем анимацию для тоста
    const style = document.createElement('style');
    style.textContent = `@keyframes fadeOut { 0%,70% { opacity:1; } 100% { opacity:0; } }`;
    document.head.appendChild(style);

    // ========== СОБЫТИЯ ==========
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${btn.dataset.page}`).classList.add('active');
        });
    });

    document.getElementById('clickBtn').onclick = () => {
        const gain = getClickGain();
        game.gold += gain;
        saveGame();
        updateUI();
    };

    document.getElementById('changeNickBtn').onclick = () => {
        const newNick = prompt("Новый ник:", game.nick);
        if (newNick && newNick.trim()) {
            game.nick = newNick.trim();
            saveGame();
            updateUI();
        }
    };

    document.getElementById('resetBtn').onclick = () => {
        if (confirm("Сбросить прогресс?")) {
            localStorage.clear();
            location.reload();
        }
    };

    document.getElementById('activatePromoBtn').onclick = activatePromo;
    document.getElementById('openCommonCase').onclick = () => openCase(500, commonSkins, "📦 Обычный кейс");
    document.getElementById('openRareCase').onclick = () => openCase(1500, rareSkins, "🔥 Редкий кейс");
    document.getElementById('openLegendaryCase').onclick = () => openCase(5000, legendarySkins, "💎 Легендарный кейс");
    document.getElementById('openCraftWindowBtn').onclick = () => { if(craftSelectedSkin) openCraftWindow(); else showToast("❌ Выбери скин!"); };
    document.getElementById('doCraftBtn').onclick = doCraft;
    document.getElementById('closeCraftBtn').onclick = closeCraftWindow;

    // Экспорт в глобальную область
    window.selectSkinForWeapon = selectSkinForWeapon;
    window.attachSkinToWeapon = attachSkinToWeapon;
    window.equipWeapon = equipWeapon;
    window.selectSkinForCraft = selectSkinForCraft;
    window.copyPlayerId = copyPlayerId;

    // Запуск
    loadGame();
    setInterval(saveGame, 30000);
</script>
</body>
</html>
