<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0f;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .box {
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff4d4d;
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .small {
            color: #666;
            font-size: 12px;
            margin-top: 20px;
        }
        button {
            margin-top: 25px;
            padding: 12px 30px;
            background: #ff4d4d;
            border: none;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🔧⚙️</div>
        <h1>ТЕХНИЧЕСКИЕ РАБОТЫ</h1>
        <p>Сервер временно недоступен</p>
        <p>Идёт исправление игры</p>
        <div class="small">Пожалуйста, подождите и обновите страницу позже</div>
        <button onclick="location.reload()">Обновить</button>
    </div>
</body>
</html>
