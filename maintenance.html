<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Технические работы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(255,40,40,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255,40,40,0.06) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        /* Частицы */
        .particle {
            position: absolute;
            background: rgba(255,77,77,0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-100px) translateX(50px); opacity: 0; }
        }

        /* Основной контейнер */
        .maintenance-container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Иконка */
        .maintenance-icon {
            font-size: 100px;
            margin-bottom: 20px;
            animation: iconGlow 1.5s infinite alternate, iconRotate 3s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(255,77,77,0.5));
        }

        @keyframes iconGlow {
            0% {
                filter: drop-shadow(0 0 10px rgba(255,77,77,0.3));
                text-shadow: 0 0 10px rgba(255,77,77,0.3);
            }
            100% {
                filter: drop-shadow(0 0 30px rgba(255,77,77,0.8));
                text-shadow: 0 0 30px rgba(255,77,77,0.8);
            }
        }

        @keyframes iconRotate {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        /* Заголовок */
        .maintenance-title {
            font-size: clamp(28px, 8vw, 48px);
            font-weight: 900;
            background: linear-gradient(135deg, #ff4d4d, #ff9999, #ff4d4d);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleShine 2s ease infinite, titlePulse 1.5s infinite alternate;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        @keyframes titleShine {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes titlePulse {
            0% { letter-spacing: 4px; opacity: 0.9; }
            100% { letter-spacing: 8px; opacity: 1; }
        }

        /* Текст */
        .maintenance-text {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .maintenance-subtext {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 30px;
        }

        /* Прогресс бар */
        .progress-container {
            max-width: 400px;
            margin: 30px auto;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 3px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,77,77,0.3);
        }

        .progress-bar {
            height: 8px;
            background: linear-gradient(90deg, #ff4d4d, #ff9999, #ff4d4d);
            background-size: 200% 100%;
            border-radius: 50px;
            width: 0%;
            animation: loading 3s ease-in-out infinite, gradientShift 2s ease infinite;
            box-shadow: 0 0 10px rgba(255,77,77,0.5);
        }

        @keyframes loading {
            0% { width: 0%; }
            30% { width: 35%; }
            60% { width: 70%; }
            85% { width: 85%; }
            100% { width: 95%; }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .progress-text {
            margin-top: 12px;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 2px;
        }

        /* Кнопка обновления */
        .refresh-btn {
            margin-top: 30px;
            padding: 14px 40px;
            background: linear-gradient(135deg, rgba(255,77,77,0.2), rgba(255,77,77,0.05));
            border: 2px solid rgba(255,77,77,0.5);
            border-radius: 50px;
            color: #ff4d4d;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, rgba(255,77,77,0.3), rgba(255,77,77,0.1));
            border-color: rgba(255,77,77,0.8);
            box-shadow: 0 0 30px rgba(255,77,77,0.3);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        /* Статус */
        .status {
            margin-top: 20px;
            font-size: 12px;
            color: #ff4d4d;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Счетчик */
        .counter {
            margin-top: 15px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">
            🔧⚙️🔨
        </div>
        <h1 class="maintenance-title">Технические работы</h1>
        <div class="maintenance-text">
            Сервер временно недоступен
        </div>
        <div class="maintenance-subtext">
            Идут плановые работы по обновлению игры
        </div>

        <div class="progress-container">
            <div class="progress-bar"></div>
            <div class="progress-text">Подготовка сервера...</div>
        </div>

        <button class="refresh-btn" onclick="location.reload()">
            🔄 Обновить страницу
        </button>

        <div class="status">
            ⚠ ОЖИДАЙТЕ ⚠
        </div>
        <div class="counter" id="counter">
            Попробуйте через несколько минут
        </div>
    </div>

    <!-- Создаем летающие частицы -->
    <script>
        function createParticles() {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 8 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = Math.random() * 4 + 4 + 's';
                document.body.appendChild(particle);
            }
        }

        // Динамический счетчик
        let counter = 0;
        setInterval(() => {
            counter++;
            const counterEl = document.getElementById('counter');
            if (counterEl) {
                const minutes = Math.floor(counter / 60);
                const seconds = counter % 60;
                counterEl.innerHTML = `Ожидание: ${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);

        createParticles();
    </script>
</body>
</html>
